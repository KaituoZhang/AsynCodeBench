<rect class="graph-node" data-node="unicode_version_catalog" x="67.0" y="326.0" width="326" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
<text x="85.0" y="354.0" font-size="17" fill="#101828" font-weight="700" text-anchor="start">
