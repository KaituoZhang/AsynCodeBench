<tspan x="1079.0" dy="0">D2 · INT</tspan>
</text>
<text x="62" y="716" font-size="20" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="62" dy="0">Dependency contracts</tspan>
</text>
<line x1="62" y1="725" x2="1538" y2="725" stroke="#EAECF0"/>
<rect x="62" y="742" width="92" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
<text x="108" y="762" font-size="12" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D1 · IF</tspan>
</text>
<text x="174" y="758" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">wcwidth.unicode_versions_to_width.version_matching_contract</tspan>
</text>
<text x="174" y="784" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">The width algorithm must consume list_versions() as an ascending catalog of supported Unicode version strings and implement</tspan>
<tspan x="174" dy="20">exact, nearest, low, high, latest, and invalid-version matching against that catalog.</tspan>
</text>
<line x1="62" y1="811" x2="1538" y2="811" stroke="#EAECF0"/>
<rect x="62" y="828" width="92" height="30" rx="15" fill="#ECFDF5" stroke="#059669"/>
<text x="108" y="848" font-size="12" fill="#059669" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D2 · INT</tspan>
</text>
<text x="174" y="844" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">wcwidth.width_to_integration.public_width_contract</tspan>
</text>
<text x="174" y="870" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">The completed width algorithm must preserve public wcwidth() and wcswidth() behavior for empty strings, C0 controls, combining</tspan>
<tspan x="174" dy="20">characters, East-Asian wide characters, emoji ZWJ sequences, VS-16 presentation, and table integrity.</tspan>
</text>
<text x="1552" y="936" font-size="12" fill="#98A2B3" font-weight="400" text-anchor="end">
<tspan x="1552" dy="0">Source: AsynCodeBench dependency annotations</tspan>
</text>
</svg>
