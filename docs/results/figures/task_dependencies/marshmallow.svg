</text>
<text x="1138.0" y="531.0" font-size="12" fill="#475467" font-weight="400" text-anchor="start">
<tspan x="1138.0" dy="0">src/marshmallow/decorators.py</tspan>
<tspan x="1138.0" dy="16">+ 2 additional files</tspan>
</text>
<text x="1138.0" y="577.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="1138.0" dy="0">owner: schema_agent</tspan>
</text>
<rect class="edge-label" data-edge="D1" x="1490.0" y="374.0" width="104" height="32" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="1542.0" y="395.0" font-size="13" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="1542.0" dy="0">D1 · API</tspan>
</text>
<rect class="edge-label" data-edge="D2" x="742.0" y="284.0" width="104" height="32" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="794.0" y="305.0" font-size="13" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D2 · IF</tspan>
</text>
<rect class="edge-label" data-edge="D3" x="998.0" y="374.0" width="120" height="32" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="1058.0" y="395.0" font-size="13" fill="#D97706" font-weight="700" text-anchor="middle">
<tspan x="1058.0" dy="0">D3 · STATE</tspan>
</text>
<text x="62" y="716" font-size="20" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="62" dy="0">Dependency contracts</tspan>
</text>
<line x1="62" y1="725" x2="1538" y2="725" stroke="#EAECF0"/>
<rect x="62" y="742" width="92" height="30" rx="15" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="108" y="762" font-size="12" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D1 · API</tspan>
</text>
<text x="174" y="758" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">marshmallow.fields_to_schema.validation_contract</tspan>
</text>
<text x="174" y="784" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Field deserialize/serialize, validator, missing/default/null, and utility conversion contracts must be stable for Schema.load,</tspan>
<tspan x="174" dy="20">Schema.dump, and Schema.validate.</tspan>
</text>
<line x1="62" y1="811" x2="1538" y2="811" stroke="#EAECF0"/>
<rect x="62" y="828" width="92" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
<text x="108" y="848" font-size="12" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D2 · IF</tspan>
</text>
<text x="174" y="844" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">marshmallow.registry_to_nested.schema_resolution_contract</tspan>
</text>
<text x="174" y="870" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Schema registration, declared-field collection, Meta options, and class-name lookup must support Nested fields, self references,</tspan>
<tspan x="174" dy="20">and only/exclude propagation.</tspan>
</text>
<line x1="62" y1="897" x2="1538" y2="897" stroke="#EAECF0"/>
<rect x="62" y="914" width="92" height="30" rx="15" fill="#FFFBEB" stroke="#D97706"/>
<text x="108" y="934" font-size="12" fill="#D97706" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D3 · STATE</tspan>
</text>
<text x="174" y="930" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">marshmallow.decorators_to_schema.hook_error_contract</tspan>
</text>
<text x="174" y="956" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Decorator hook metadata, schema hook invocation, and ErrorStore merge semantics must agree with field and schema validation</tspan>
<tspan x="174" dy="20">error contracts.</tspan>
</text>
<text x="1552" y="1022" font-size="12" fill="#98A2B3" font-weight="400" text-anchor="end">
<tspan x="1552" dy="0">Source: AsynCodeBench v0.4 frozen async-metrics annotations</tspan>
</text>
