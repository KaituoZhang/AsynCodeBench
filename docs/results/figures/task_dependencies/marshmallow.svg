<path class="dependency-edge" data-edge="D2" data-source="registry_declaration_layer" data-target="field_validation_layer" d="M 480.0 390.0 C 743.76 390.0, 844.24 210.0, 1108.0 210.0" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-if)"/>
<path class="dependency-edge" data-edge="D3" data-source="schema_processing_layer" data-target="field_validation_layer" d="M 1199.2 461.0 C 1058.0 461.0, 1058.0 319.0, 1199.2 319.0" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#arrow-state)"/>
