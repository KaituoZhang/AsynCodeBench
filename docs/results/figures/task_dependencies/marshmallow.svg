<tspan x="1138.0" dy="16">+ 2 additional files</tspan>
</text>
<text x="1138.0" y="307.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="1138.0" dy="0">owner: field_agent</tspan>
</text>
<rect class="graph-node" data-node="schema_processing_layer" x="1120.0" y="461.0" width="360" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
