<text x="770.0" y="62" font-size="13" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="770.0" dy="0">IF</tspan>
</text>
<rect x="821" y="42" width="70" height="29" rx="14.5" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="856.0" y="62" font-size="13" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="856.0" dy="0">API</tspan>
</text>
<rect x="907" y="42" width="92" height="29" rx="14.5" fill="#FFFBEB" stroke="#D97706"/>
<text x="953.0" y="62" font-size="13" fill="#D97706" font-weight="700" text-anchor="middle">
<tspan x="953.0" dy="0">STATE</tspan>
</text>
<rect x="1015" y="42" width="70" height="29" rx="14.5" fill="#ECFDF5" stroke="#059669"/>
<text x="1050.0" y="62" font-size="13" fill="#059669" font-weight="700" text-anchor="middle">
<tspan x="1050.0" dy="0">INT</tspan>
</text>
<rect x="42" y="104" width="1516" height="576" rx="22" fill="#FCFCFD" stroke="#EAECF0"/>
<path class="dependency-edge" data-edge="D1" data-source="config_prompt_layer" data-target="orchestration_layer" d="M 480.0 195.0 C 743.76 195.0, 844.24 345.0, 1108.0 345.0" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#arrow-state)"/>
<path class="dependency-edge" data-edge="D2" data-source="repository_source_layer" data-target="orchestration_layer" d="M 480.0 390.0 C 743.76 390.0, 844.24 390.0, 1108.0 390.0" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-if)"/>
<path class="dependency-edge" data-edge="D3" data-source="generation_hook_layer" data-target="orchestration_layer" d="M 480.0 585.0 C 743.76 585.0, 844.24 435.0, 1108.0 435.0" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#arrow-int)"/>
<rect class="graph-node" data-node="config_prompt_layer" x="120.0" y="131.0" width="360" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
<text x="138.0" y="159.0" font-size="17" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="138.0" dy="0">Config Prompt Layer</tspan>
</text>
<text x="138.0" y="201.0" font-size="12" fill="#475467" font-weight="400" text-anchor="start">
<tspan x="138.0" dy="0">cookiecutter/config.py</tspan>
<tspan x="138.0" dy="16">+ 2 additional files</tspan>
</text>
<text x="138.0" y="247.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="138.0" dy="0">owner: config_prompt_agent</tspan>
</text>
<rect class="graph-node" data-node="repository_source_layer" x="120.0" y="326.0" width="360" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
<text x="138.0" y="354.0" font-size="17" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="138.0" dy="0">Repository Source Layer</tspan>
</text>
<text x="138.0" y="396.0" font-size="12" fill="#475467" font-weight="400" text-anchor="start">
<tspan x="138.0" dy="0">cookiecutter/repository.py</tspan>
<tspan x="138.0" dy="16">+ 2 additional files</tspan>
</text>
<text x="138.0" y="442.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="138.0" dy="0">owner: source_agent</tspan>
</text>
<rect class="graph-node" data-node="generation_hook_layer" x="120.0" y="521.0" width="360" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
<text x="138.0" y="549.0" font-size="17" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="138.0" dy="0">Generation Hook Layer</tspan>
</text>
<text x="138.0" y="591.0" font-size="12" fill="#475467" font-weight="400" text-anchor="start">
<tspan x="138.0" dy="0">cookiecutter/environment.py</tspan>
<tspan x="138.0" dy="16">+ 4 additional files</tspan>
</text>
<text x="138.0" y="637.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="138.0" dy="0">owner: generation_agent</tspan>
</text>
<rect class="graph-node" data-node="orchestration_layer" x="1120.0" y="326.0" width="360" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
<text x="1138.0" y="354.0" font-size="17" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="1138.0" dy="0">Orchestration Layer</tspan>
</text>
<text x="1138.0" y="396.0" font-size="12" fill="#475467" font-weight="400" text-anchor="start">
<tspan x="1138.0" dy="0">cookiecutter/cli.py</tspan>
<tspan x="1138.0" dy="16">cookiecutter/main.py</tspan>
</text>
<text x="1138.0" y="442.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="1138.0" dy="0">owner: orchestration_agent</tspan>
</text>
<rect class="edge-label" data-edge="D1" x="734.0" y="254.0" width="120" height="32" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
<text x="794.0" y="275.0" font-size="13" fill="#D97706" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D1 · STATE</tspan>
</text>
<rect class="edge-label" data-edge="D2" x="742.0" y="374.0" width="104" height="32" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="794.0" y="395.0" font-size="13" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D2 · IF</tspan>
</text>
<rect class="edge-label" data-edge="D3" x="742.0" y="494.0" width="104" height="32" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
<text x="794.0" y="515.0" font-size="13" fill="#059669" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D3 · INT</tspan>
</text>
<text x="62" y="716" font-size="20" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="62" dy="0">Dependency contracts</tspan>
</text>
<line x1="62" y1="725" x2="1538" y2="725" stroke="#EAECF0"/>
<rect x="62" y="742" width="92" height="30" rx="15" fill="#FFFBEB" stroke="#D97706"/>
<text x="108" y="762" font-size="12" fill="#D97706" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D1 · STATE</tspan>
</text>
<text x="174" y="758" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">cookiecutter.config_prompt_to_main.context_contract</tspan>
</text>
<text x="174" y="784" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Configuration, replay, and prompt code must provide stable context shape, default merging, no_input, choices, and extra_context</tspan>
<tspan x="174" dy="20">behavior consumed by the top-level workflow.</tspan>
</text>
<line x1="62" y1="811" x2="1538" y2="811" stroke="#EAECF0"/>
<rect x="62" y="828" width="92" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
<text x="108" y="848" font-size="12" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D2 · IF</tspan>
</text>
<text x="174" y="844" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">cookiecutter.source_to_main.repo_dir_contract</tspan>
</text>
<text x="174" y="870" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Repository, VCS, and zipfile source resolution must return stable repo_dir, cleanup, URL/archive classification, and cache reuse</tspan>
<tspan x="174" dy="20">semantics consumed by cookiecutter().</tspan>
</text>
<line x1="62" y1="897" x2="1538" y2="897" stroke="#EAECF0"/>
<rect x="62" y="914" width="92" height="30" rx="15" fill="#ECFDF5" stroke="#059669"/>
<text x="108" y="934" font-size="12" fill="#059669" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D3 · INT</tspan>
</text>
<text x="174" y="930" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">cookiecutter.generate_hooks_to_main.project_contract</tspan>
</text>
<text x="174" y="956" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Generation and hooks must provide stable project directory creation, overwrite/skip behavior, hook execution, failure cleanup,</tspan>
<tspan x="174" dy="20">and undefined-variable semantics consumed by the workflow.</tspan>
</text>
<text x="1552" y="1022" font-size="12" fill="#98A2B3" font-weight="400" text-anchor="end">
<tspan x="1552" dy="0">Source: AsynCodeBench v0.4 frozen async-metrics annotations</tspan>
</text>
</svg>
