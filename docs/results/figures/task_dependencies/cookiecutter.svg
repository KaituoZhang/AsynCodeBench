<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1042" viewBox="0 0 1600 1042" role="img" aria-labelledby="title desc">
<title id="title">cookiecutter dependency graph</title>
<desc id="desc">Unique artifact nodes connected by all frozen dependency points.</desc>
<defs>
<marker id="arrow-if" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 12 6 L 0 12 z" fill="#2563EB"/>
</marker>
<marker id="arrow-api" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 12 6 L 0 12 z" fill="#7C3AED"/>
</marker>
<marker id="arrow-state" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 12 6 L 0 12 z" fill="#D97706"/>
</marker>
<marker id="arrow-int" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 12 6 L 0 12 z" fill="#059669"/>
</marker>
</defs>
<rect x="0" y="0" width="1600" height="1042" fill="#FFFFFF"/>
<text x="62" y="48" font-size="28" fill="#101828" font-weight="700" text-anchor="start">
