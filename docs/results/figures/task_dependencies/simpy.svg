<tspan x="1050.0" dy="0">INT</tspan>
</text>
<rect x="42" y="104" width="1516" height="576" rx="22" fill="#FCFCFD" stroke="#EAECF0"/>
<path class="dependency-edge" data-edge="D1" data-source="environment_core" data-target="event_lifecycle" d="M 393.0 345.0 C 490.44 345.0, 527.56 255.0, 625.0 255.0" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-if)"/>
<path class="dependency-edge" data-edge="D2" data-source="event_lifecycle" data-target="resource_layer" d="M 963.0 255.0 C 1060.44 255.0, 1097.56 390.0, 1195.0 390.0" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#arrow-api)"/>
<path class="dependency-edge" data-edge="D3" data-source="environment_core" data-target="realtime_and_utilities" d="M 393.0 435.0 C 490.44 435.0, 527.56 525.0, 625.0 525.0" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow-if)"/>
<rect class="graph-node" data-node="environment_core" x="67.0" y="326.0" width="326" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
<text x="85.0" y="354.0" font-size="17" fill="#101828" font-weight="700" text-anchor="start">
