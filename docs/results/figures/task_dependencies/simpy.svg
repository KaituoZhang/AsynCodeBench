<tspan x="655.0" dy="0">Event Lifecycle</tspan>
</text>
<text x="655.0" y="261.0" font-size="12" fill="#475467" font-weight="400" text-anchor="start">
<tspan x="655.0" dy="0">src/simpy/events.py</tspan>
<tspan x="655.0" dy="16">src/simpy/exceptions.py</tspan>
</text>
<text x="655.0" y="307.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="655.0" dy="0">owner: event_agent</tspan>
</text>
<rect class="graph-node" data-node="realtime_and_utilities" x="637.0" y="461.0" width="326" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
<text x="655.0" y="489.0" font-size="17" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="655.0" dy="0">Realtime And Utilities</tspan>
</text>
<text x="655.0" y="531.0" font-size="12" fill="#475467" font-weight="400" text-anchor="start">
<tspan x="655.0" dy="0">src/simpy/rt.py</tspan>
<tspan x="655.0" dy="16">src/simpy/util.py</tspan>
</text>
<text x="655.0" y="577.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="655.0" dy="0">owner: realtime_util_agent</tspan>
</text>
<rect class="graph-node" data-node="resource_layer" x="1207.0" y="326.0" width="326" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
<text x="1225.0" y="354.0" font-size="17" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="1225.0" dy="0">Resource Layer</tspan>
</text>
<text x="1225.0" y="396.0" font-size="12" fill="#475467" font-weight="400" text-anchor="start">
<tspan x="1225.0" dy="0">src/simpy/resources/base.py</tspan>
<tspan x="1225.0" dy="16">+ 3 additional files</tspan>
</text>
<text x="1225.0" y="442.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="1225.0" dy="0">owner: resource_agent</tspan>
</text>
<rect class="edge-label" data-edge="D1" x="457.0" y="284.0" width="104" height="32" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="509.0" y="305.0" font-size="13" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="509.0" dy="0">D1 · IF</tspan>
</text>
<rect class="edge-label" data-edge="D2" x="1027.0" y="306.5" width="104" height="32" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="1079.0" y="327.5" font-size="13" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="1079.0" dy="0">D2 · API</tspan>
</text>
<rect class="edge-label" data-edge="D3" x="457.0" y="464.0" width="104" height="32" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="509.0" y="485.0" font-size="13" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="509.0" dy="0">D3 · IF</tspan>
</text>
<text x="62" y="716" font-size="20" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="62" dy="0">Dependency contracts</tspan>
</text>
<line x1="62" y1="725" x2="1538" y2="725" stroke="#EAECF0"/>
<rect x="62" y="742" width="92" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
<text x="108" y="762" font-size="12" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D1 · IF</tspan>
</text>
<text x="174" y="758" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">simpy.environment_to_events.scheduling_contract</tspan>
</text>
<text x="174" y="784" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Environment.run/step/peek/timeout/process must provide correct now, scheduling, callback, and exception behavior for Event,</tspan>
<tspan x="174" dy="20">Process, Timeout, and Condition consumers.</tspan>
</text>
<line x1="62" y1="811" x2="1538" y2="811" stroke="#EAECF0"/>
<rect x="62" y="828" width="92" height="30" rx="15" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="108" y="848" font-size="12" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D2 · API</tspan>
</text>
<text x="174" y="844" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">simpy.events_to_resources.request_trigger_contract</tspan>
</text>
<text x="174" y="870" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Resource requests, releases, stores, containers, and priority/preemptive queues must consume event triggered/processed state,</tspan>
<tspan x="174" dy="20">callbacks, and process resumption consistently.</tspan>
</text>
<line x1="62" y1="897" x2="1538" y2="897" stroke="#EAECF0"/>
<rect x="62" y="914" width="92" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
<text x="108" y="934" font-size="12" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D3 · IF</tspan>
</text>
<text x="174" y="930" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">simpy.environment_to_realtime_util.run_timeout_contract</tspan>
</text>
<text x="174" y="956" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">RealtimeEnvironment and utility helpers depend on Environment.run(), timeout, process, and negative-delay semantics.</tspan>
</text>
<text x="1552" y="1002" font-size="12" fill="#98A2B3" font-weight="400" text-anchor="end">
<tspan x="1552" dy="0">Source: AsynCodeBench v0.4 frozen async-metrics annotations</tspan>
</text>
</svg>
