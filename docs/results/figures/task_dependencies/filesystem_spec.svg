<text x="794.0" y="275.0" font-size="13" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D1 · IF</tspan>
</text>
<rect class="edge-label" data-edge="D2" x="742.0" y="374.0" width="104" height="32" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="794.0" y="395.0" font-size="13" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D2 · API</tspan>
</text>
<rect class="edge-label" data-edge="D3" x="742.0" y="494.0" width="104" height="32" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="794.0" y="515.0" font-size="13" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D3 · API</tspan>
</text>
<text x="62" y="716" font-size="20" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="62" dy="0">Dependency contracts</tspan>
</text>
<line x1="62" y1="725" x2="1538" y2="725" stroke="#EAECF0"/>
<rect x="62" y="742" width="92" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
<text x="108" y="762" font-size="12" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D1 · IF</tspan>
</text>
<text x="174" y="758" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">filesystem_spec.registry_to_core.protocol_resolution_contract</tspan>
</text>
<text x="174" y="784" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Protocol registry lookup, deferred implementation import, and filesystem instantiation must be stable for url_to_fs, open_files,</tspan>
<tspan x="174" dy="20">and core list/open behavior.</tspan>
</text>
<line x1="62" y1="811" x2="1538" y2="811" stroke="#EAECF0"/>
<rect x="62" y="828" width="92" height="30" rx="15" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="108" y="848" font-size="12" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D2 · API</tspan>
</text>
<text x="174" y="844" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">filesystem_spec.utils_to_core.path_compression_contract</tspan>
</text>
<text x="174" y="870" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">URL/protocol parsing, path expansion helpers, read-block utilities, and compression registration must support core</tspan>
<tspan x="174" dy="20">OpenFile/OpenFiles behavior.</tspan>
</text>
<line x1="62" y1="897" x2="1538" y2="897" stroke="#EAECF0"/>
<rect x="62" y="914" width="92" height="30" rx="15" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="108" y="934" font-size="12" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D3 · API</tspan>
</text>
<text x="174" y="930" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">filesystem_spec.backends_to_core.open_contract</tspan>
</text>
<text x="174" y="956" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">AbstractFileSystem and the local, memory, and cache backends must provide the open, info, glob, parent, cache mapping, and</tspan>
<tspan x="174" dy="20">local-file behavior consumed by core OpenFile/open_local paths.</tspan>
</text>
<text x="1552" y="1022" font-size="12" fill="#98A2B3" font-weight="400" text-anchor="end">
<tspan x="1552" dy="0">Source: AsynCodeBench v0.4 frozen async-metrics annotations</tspan>
</text>
</svg>
