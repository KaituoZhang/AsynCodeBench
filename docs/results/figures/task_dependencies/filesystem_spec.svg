<tspan x="138.0" dy="0">fsspec/compression.py</tspan>
<tspan x="138.0" dy="16">fsspec/utils.py</tspan>
</text>
<text x="138.0" y="442.0" font-size="11" fill="#98A2B3" font-weight="400" text-anchor="start">
<tspan x="138.0" dy="0">owner: utility_agent</tspan>
</text>
<rect class="graph-node" data-node="filesystem_backend_layer" x="120.0" y="521.0" width="360" height="128" rx="15" fill="#FFFFFF" stroke="#667085" stroke-width="1.8"/>
