<text x="794.0" y="237.5" font-size="13" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D3 · IF</tspan>
</text>
<rect class="edge-label" data-edge="D4" x="742.0" y="494.0" width="104" height="32" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="794.0" y="515.0" font-size="13" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D4 · API</tspan>
</text>
<rect class="edge-label" data-edge="D5" x="742.0" y="554.0" width="104" height="32" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="794.0" y="575.0" font-size="13" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="794.0" dy="0">D5 · API</tspan>
</text>
<text x="62" y="716" font-size="20" fill="#101828" font-weight="700" text-anchor="start">
<tspan x="62" dy="0">Dependency contracts</tspan>
</text>
<line x1="62" y1="725" x2="1538" y2="725" stroke="#EAECF0"/>
<rect x="62" y="742" width="92" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
<text x="108" y="762" font-size="12" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D1 · IF</tspan>
</text>
<text x="174" y="758" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">cachetools.keys_to_func.untyped_key_contract</tspan>
</text>
<text x="174" y="784" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Function decorators with typed=False must use the untyped key behavior from hashkey: equal values of different numeric types</tspan>
<tspan x="174" dy="20">share the same cache key, positional and keyword arguments are represented stably, and keys remain hashable.</tspan>
</text>
<line x1="62" y1="811" x2="1538" y2="811" stroke="#EAECF0"/>
<rect x="62" y="828" width="92" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
<text x="108" y="848" font-size="12" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D2 · IF</tspan>
</text>
<text x="174" y="844" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">cachetools.keys_to_func.typed_key_contract</tspan>
</text>
<text x="174" y="870" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Function decorators with typed=True must select typedkey semantics from keys.py, so equal values of different types are cached</tspan>
<tspan x="174" dy="20">separately while preserving the same cache metadata API.</tspan>
</text>
<line x1="62" y1="897" x2="1538" y2="897" stroke="#EAECF0"/>
<rect x="62" y="914" width="92" height="30" rx="15" fill="#EFF6FF" stroke="#2563EB"/>
<text x="108" y="934" font-size="12" fill="#2563EB" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D3 · IF</tspan>
</text>
<text x="174" y="930" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">cachetools.keys_to_cachedmethod.typed_method_key_contract</tspan>
</text>
<text x="174" y="956" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">typedmethodkey must ignore self while preserving typed argument distinction for cachedmethod users.</tspan>
</text>
<line x1="62" y1="963" x2="1538" y2="963" stroke="#EAECF0"/>
<rect x="62" y="980" width="92" height="30" rx="15" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="108" y="1000" font-size="12" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D4 · API</tspan>
</text>
<text x="174" y="996" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">cachetools.core_to_func.wrapper_metadata_contract</tspan>
</text>
<text x="174" y="1022" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Decorator factories must expose the same cache wrapper metadata contract as cached(): cache_info(), cache_clear(),</tspan>
<tspan x="174" dy="20">cache_parameters(), cache attribute, cache_key, and lock behavior where applicable.</tspan>
</text>
<line x1="62" y1="1049" x2="1538" y2="1049" stroke="#EAECF0"/>
<rect x="62" y="1066" width="92" height="30" rx="15" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="108" y="1086" font-size="12" fill="#7C3AED" font-weight="700" text-anchor="middle">
<tspan x="108" dy="0">D5 · API</tspan>
</text>
<text x="174" y="1082" font-size="13" fill="#475467" font-weight="600" text-anchor="start">
<tspan x="174" dy="0">cachetools.core_to_func.maxsize_and_lock_contract</tspan>
</text>
<text x="174" y="1108" font-size="14" fill="#344054" font-weight="400" text-anchor="start">
<tspan x="174" dy="0">Decorator factories must preserve cache-class edge cases and wrapper lock semantics: maxsize=0 disables storage, maxsize=None</tspan>
<tspan x="174" dy="20">gives an unbounded cache, and recursive equality requires an RLock-compatible wrapper path.</tspan>
</text>
<text x="1552" y="1174" font-size="12" fill="#98A2B3" font-weight="400" text-anchor="end">
<tspan x="1552" dy="0">Source: AsynCodeBench v0.4 frozen async-metrics annotations</tspan>
</text>
</svg>
