<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="800" viewBox="0 0 1540 800">
<rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="48" y="50" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#172033" text-anchor="start">Protocol Effects through AsynCodeBench Metrics</text>
<text x="48" y="80" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#596579" text-anchor="start">Green = movement in the favorable direction; red = degradation</text>
<rect x="45" y="115" width="715" height="610" rx="14" fill="#ffffff" stroke="#dce2ec"/>
<text x="73" y="158" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Serial → Async private</text>
<text x="77" y="212" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">ADPR</text>
<text x="715" y="212" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c44848" text-anchor="end">-26.7 pp</text>
<line x1="77" y1="229" x2="715" y2="229" stroke="#edf0f5"/>
<text x="77" y="271" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">DRE</text>
<text x="715" y="271" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c44848" text-anchor="end">-7.1 pp</text>
<line x1="77" y1="288" x2="715" y2="288" stroke="#edf0f5"/>
<text x="77" y="330" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">Unresolved</text>
<text x="715" y="330" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c44848" text-anchor="end">+0.75</text>
<line x1="77" y1="347" x2="715" y2="347" stroke="#edf0f5"/>
<text x="77" y="389" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">DRS-P</text>
<text x="715" y="389" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c44848" text-anchor="end">+3.19</text>
<line x1="77" y1="406" x2="715" y2="406" stroke="#edf0f5"/>
<text x="77" y="448" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">CAIL-P</text>
<text x="715" y="448" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c44848" text-anchor="end">+2.15</text>
<line x1="77" y1="465" x2="715" y2="465" stroke="#edf0f5"/>
<text x="77" y="507" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">FSAR</text>
<text x="715" y="507" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c44848" text-anchor="end">+16.7 pp</text>
<line x1="77" y1="524" x2="715" y2="524" stroke="#edf0f5"/>
<text x="77" y="566" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">IFR</text>
<text x="715" y="566" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c44848" text-anchor="end">+15.0 pp</text>
<line x1="77" y1="583" x2="715" y2="583" stroke="#edf0f5"/>
<text x="77" y="625" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">Runtime</text>
<text x="715" y="625" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#23845d" text-anchor="end">-25.3%</text>
<line x1="77" y1="642" x2="715" y2="642" stroke="#edf0f5"/>
<text x="73" y="690" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#596579" text-anchor="start">Faster runtime accompanies weaker dependency closure and later integration.</text>
<rect x="795" y="115" width="715" height="610" rx="14" fill="#ffffff" stroke="#dce2ec"/>
<text x="823" y="158" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Async private → CAID</text>
<text x="827" y="212" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">ADPR</text>
<text x="1465" y="212" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#23845d" text-anchor="end">+57.5 pp</text>
<line x1="827" y1="229" x2="1465" y2="229" stroke="#edf0f5"/>
<text x="827" y="271" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">DRE</text>
<text x="1465" y="271" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#23845d" text-anchor="end">+5.8 pp</text>
<line x1="827" y1="288" x2="1465" y2="288" stroke="#edf0f5"/>
<text x="827" y="330" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">Unresolved</text>
<text x="1465" y="330" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#23845d" text-anchor="end">-1.65</text>
<line x1="827" y1="347" x2="1465" y2="347" stroke="#edf0f5"/>
<text x="827" y="389" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">DRS-P</text>
<text x="1465" y="389" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#23845d" text-anchor="end">-1.00</text>
<line x1="827" y1="406" x2="1465" y2="406" stroke="#edf0f5"/>
<text x="827" y="448" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">CAIL-P</text>
<text x="1465" y="448" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#23845d" text-anchor="end">-2.51</text>
<line x1="827" y1="465" x2="1465" y2="465" stroke="#edf0f5"/>
<text x="827" y="507" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">FSAR</text>
<text x="1465" y="507" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#23845d" text-anchor="end">-1.6 pp</text>
<line x1="827" y1="524" x2="1465" y2="524" stroke="#edf0f5"/>
<text x="827" y="566" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">IFR</text>
<text x="1465" y="566" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#23845d" text-anchor="end">-60.0 pp</text>
<line x1="827" y1="583" x2="1465" y2="583" stroke="#edf0f5"/>
<text x="827" y="625" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#344054" text-anchor="start">Runtime</text>
<text x="1465" y="625" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c44848" text-anchor="end">+87.5%</text>
<line x1="827" y1="642" x2="1465" y2="642" stroke="#edf0f5"/>
<text x="823" y="690" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#596579" text-anchor="start">CAID recovers dependency closure and integration lag at substantially higher runtime.</text>
<text x="48" y="768" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#596579" text-anchor="start">All deltas are macro-averaged across the same 20 tasks; comparison minus baseline.</text>
</svg>
